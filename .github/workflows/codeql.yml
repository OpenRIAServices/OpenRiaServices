name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore:
    - '**/*.md'
    - '**/*.txt'
    - '**/*.nuspec'
  schedule:
  - cron: "5 13 1 * *"

jobs:
  analyze:
    name: Analyze
    runs-on: windows-2025-vs2026
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ csharp ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: +security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: build
      # The analyzers only add noise (and build time) here, CodeQL does the analysis in this workflow
      run: dotnet build OpenRiaServices.slnx --configuration Release -p:RunAnalyzers=false
      working-directory: src

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
