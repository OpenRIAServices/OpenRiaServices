pool:
  vmImage: 'windows-2025-vs2026'

variables:
  BuildConfiguration: 'release'
  BuildPlatform: 'any cpu'
  Solution: 'src\RiaServices.sln'
  # Msbuild might create logs in the following directory in case some of the "tool" tests fail
  MSBUILDDEBUGPATH: $(Build.ArtifactStagingDirectory)
  RunProcMonDuringTest: false
  # Directory used for test results (trx), code coverage and crash/hang dumps
  TestResultsDirectory: $(Agent.TempDirectory)\TestResults
  # Define the following variable for the build pipeline in order to enable SonarCloud analysis
  # sonarcloud-endpoint: 'sonarcloud.io'

steps:

# Uncomment below to install dotnet runtime and SDK if they stop beeing preinstalled
## install dotnet 8
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

## install dotnet 10 sdk
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- task: NuGetToolInstaller@1
  inputs:
    versionSpec: 7.0.0

- task: gitversion/setup@3
  inputs:
    versionSpec: '5.9.0'

- task: gitversion/execute@3
  displayName: 'Use GitVersion'

- task: NuGetCommand@2
  displayName: 'NuGet restore RiaServices.sln'
  inputs:
    restoreSolution: '$(Solution)'
    configuration: '$(BuildConfiguration)'

- task: SonarCloudPrepare@3
  displayName: 'Prepare analysis on SonarCloud'
  condition: variables['sonarcloud-endpoint']
  inputs:
    SonarCloud: 'sonarcloud.io'
    organization: 'openriaservices'
    scannerMode: 'dotnet'
    projectKey: 'OpenRIAServices_OpenRiaServices'
    projectName: 'OpenRiaServices'
    projectVersion: '$(Build.BuildNumber)'
    extraProperties: |
      # Additional properties that will be passed to the scanner, 
      # Put one key=value per line, example:
      sonar.cs.vscoveragexml.reportsPaths=$(TestResultsDirectory)\coverage.xml
      sonar.cs.vstest.reportsPaths=$(TestResultsDirectory)\**\*.trx

- task: VSBuild@1
  displayName: 'Build solution RiaServices.sln'
  inputs:
    solution: '$(Solution)'
    platform: '$(BuildPlatform)'
    configuration: '$(BuildConfiguration)'
    maximumCpuCount: true

# Load test databases and setup msbuild debug path so it becomes part of artifacts 
- powershell: |
    sqllocaldb start MSSQLLocalDB
    if (-not $?) { write-error  "failed to start  MSSQLLocalDB" }

    .\Setup-TestDatabases.ps1
  displayName: 'Setup database'

- powershell: |
    dotnet tool install --global dotnet-coverage
    if (-not $?) { Write-Error 'failed to install dotnet-coverage' }
  displayName: 'Install dotnet-coverage'

# Run all tests using Microsoft.Testing.Platform (MTP) via "dotnet test".
# * Test modules run in parallel (one process per project and target framework)
# * "--report-trx" produces the trx files which are published below
# * "--crashdump"/"--hangdump" produce dumps for crashing or hanging test modules (failed test diagnostics)
# * dotnet-coverage collects code coverage for the whole run, including all child processes
- powershell: |
    New-Item -ItemType Directory -Force -Path "$(TestResultsDirectory)" | Out-Null

    $testCommand = 'dotnet test --solution RiaServices.Tests.slnf --no-build --configuration $(BuildConfiguration)' +
      ' --results-directory "$(TestResultsDirectory)" --report-trx --report-azdo --crashdump --hangdump --hangdump-timeout 20m'

    dotnet-coverage collect --settings codecoverage.config --output "$(TestResultsDirectory)\coverage.coverage" $testCommand
    $testExitCode = $LASTEXITCODE

    # Convert the collected coverage into the formats used by the Azure DevOps and SonarCloud reports
    dotnet-coverage merge --output "$(TestResultsDirectory)\coverage.cobertura.xml" --output-format cobertura "$(TestResultsDirectory)\coverage.coverage"
    dotnet-coverage merge --remove-input-files --output "$(TestResultsDirectory)\coverage.xml" --output-format xml "$(TestResultsDirectory)\coverage.coverage"

    if ($testExitCode -ne 0) { Write-Error "dotnet test failed with exit code $testExitCode" }
  displayName: 'Run tests'
  workingDirectory: 'src'
  timeoutInMinutes: 30

- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(TestResultsDirectory)'
    mergeTestResults: true
    publishRunAttachments: true
    failTaskOnFailedTests: false

- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage'
  condition: succeededOrFailed()
  inputs:
    summaryFileLocation: '$(TestResultsDirectory)\coverage.cobertura.xml'

- task: SonarCloudAnalyze@3
  inputs:
    jdkversion: 'JAVA_HOME_21_X64'
  displayName: 'Run Code Analysis'
  continueOnError: true
  condition: and(variables['sonarcloud-endpoint'], or(succeeded(), and(succeededOrFailed(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))))

- task: NuGetCommand@2
  displayName: 'NuGet pack'
  inputs:
    command: pack
    packagesToPack: 'NuGet\**\*.nuspec'
    versioningScheme: byEnvVar
    versionEnvVar: Build.BuildNumber
    packDestination: '$(Build.ArtifactStagingDirectory)'
  continueOnError: true
#  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

- task: CopyFiles@2
  displayName: 'Copy VS Extension: $(build.artifactstagingdirectory)'
  inputs:
    SourceFolder: '$(build.sourcesdirectory)'
    Contents: |
      src\VisualStudio\Installer\bin\$(BuildConfiguration)\*.vsix
      src\VisualStudio\Installer\publishManifest.json
      src\VisualStudio\Installer\assets\**
    TargetFolder: '$(build.artifactstagingdirectory)'
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

- task: CopyFiles@2
  displayName: 'Copy dump files  to $(build.artifactstagingdirectory)'
  inputs:
    SourceFolder: '$(TestResultsDirectory)'
    Contents: |
      **/*
      !**/*.coverage*
      !**/*.cobertura.xml
    TargetFolder: '$(build.artifactstagingdirectory)/testresults'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)'
  condition: succeededOrFailed()

- task: SonarCloudPublish@3
  displayName: 'Publish Quality Gate Result'
  continueOnError: true
  condition: and(variables['sonarcloud-endpoint'], or(succeeded(), and(succeededOrFailed(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))))
